
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ameer Data Hub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fb;
  color: #172033;
}

header {
  background: #075e43;
  color: white;
  padding: 25px 20px;
  border-radius: 0 0 25px 25px;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin-bottom: 0;
  color: #d8f5e8;
}

.balance {
  background: white;
  margin: 20px;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 3px 12px #0000000d;
}

.balance h2 {
  color: #075e43;
  margin: 8px 0;
}

.container {
  padding: 0 20px 30px;
}

h3 {
  margin-top: 25px;
}

.networks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.network {
  background: white;
  padding: 20px 10px;
  border-radius: 15px;
  text-align: center;
  border: 2px solid transparent;
  cursor: pointer;
  font-size: 17px;
  font-weight: bold;
}

.network.selected {
  border-color: #078354;
  background: #e5f8ef;
}

.network span {
  display: block;
  margin-bottom: 8px;
  font-size: 25px;
}

form {
  background: white;
  padding: 18px;
  border-radius: 16px;
  margin-top: 20px;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-weight: bold;
}

input, select, button {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  font-size: 16px;
}

input, select {
  border: 1px solid #ccd4df;
  background: white;
}

button {
  background: #078354;
  color: white;
  border: none;
  font-weight: bold;
  margin-top: 18px;
  cursor: pointer;
}

.notice {
  margin-top: 15px;
  padding: 12px;
  background: #fff5d9;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.5;
}

footer {
  text-align: center;
  padding: 20px;
  color: #687386;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>✚ AMEER DATA HUB</h1>
  <p>Your trusted data shopping platform</p>
</header>

<section class="balance">
  <p>My Wallet</p>
  <h2>₦0.00</h2>
  <small>Demo wallet balance</small>
</section>

<main class="container">

  <h3>📱 Select Network</h3>

  <div class="networks">
    <button type="button" class="network selected"
      data-network="MTN">
      <span>🟡</span>MTN
    </button>

    <button type="button" class="network"
      data-network="Airtel">
      <span>🔴</span>Airtel
    </button>

    <button type="button" class="network"
      data-network="Glo">
      <span>🟢</span>Glo
    </button>

    <button type="button" class="network"
      data-network="9mobile">
      <span>🟢</span>9mobile
    </button>
  </div>

  <form id="dataForm">
    <h3>Buy Data Bundle</h3>

    <label for="phone">Phone Number</label>
    <input
      type="tel"
      id="phone"
      placeholder="Enter phone number"
      maxlength="11"
      required
    >

    <label for="bundle">Select Data Bundle</label>
    <select id="bundle" required>
      <option value="">Choose data size</option>
      <option value="500MB">500 MB</option>
      <option value="1GB">1 GB</option>
      <option value="2GB">2 GB</option>
      <option value="5GB">5 GB</option>
      <option value="10GB">10 GB</option>
    </select>

    <button type="submit">Continue</button>

    <div id="message" class="notice">
      Demo only: no real data purchase or payment is processed.
    </div>
  </form>

</main>

<footer>
  © 2026 Ameer Data Hub. All rights reserved.
</footer>

<script>
let selectedNetwork = "MTN";

document.querySelectorAll(".network").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".network").forEach(item => {
      item.classList.remove("selected");
    });

    button.classList.add("selected");
    selectedNetwork = button.dataset.network;
  });
});

document.getElementById("dataForm").addEventListener("submit", event => {
  event.preventDefault();

  const phone = document.getElementById("phone").value.trim();
  const bundle = document.getElementById("bundle").value;
  const message = document.getElementById("message");

  if (!/^0[0-9]{10}$/.test(phone)) {
    message.textContent =
      "Please enter a valid 11-digit Nigerian phone number.";
    return;
  }

  message.textContent =
    "Demo order: " + selectedNetwork + " | " +
    bundle + " | " + phone +
    ". No payment has been made and no data has been sent.";
});
</script>

</body>
</html>
